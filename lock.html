<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browser Locked</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .lock-box {
      background: #1f2937;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      width: 320px;
      border: 1px solid #374151;
    }
    h2 { margin-top: 0; color: #fbbf24; }
    p { color: #9ca3af; font-size: 0.9rem; }
    input {
      width: 100%;
      padding: 0.75rem;
      margin: 1rem 0;
      background: #374151;
      border: 1px solid #4b5563;
      border-radius: 0.5rem;
      color: white;
      font-size: 1rem;
      box-sizing: border-box;
      text-align: center;
      letter-spacing: 0.2rem;
    }
    input:focus { outline: none; border-color: #fbbf24; }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #fbbf24;
      color: #111;
      border: none;
      border-radius: 0.5rem;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: #f59e0b; }
    #message { margin-top: 1rem; font-size: 0.85rem; color: #ef4444; }
  </style>
</head>
<body>
  <div class="lock-box">
    <h2>🔒 Browser Locked</h2>
    <p id="instruction">Enter your PIN to unlock</p>
    <input type="password" id="passInput" placeholder="••••" autocomplete="current-password">
    <button id="actionBtn">Unlock</button>
    <div id="message"></div>
  </div>
  <script src="lock.js"></script>
</body>
</html>
